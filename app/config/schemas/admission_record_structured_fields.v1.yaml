version: "admission_record_structured_fields.v1"
document_type: copd_admission_record
field_groups:
  - group_key: chief_complaint
    group_label: 主诉
    fields:
      - field_key: chief_complaint
        label: 主诉
        type: string
  - group_key: history_of_present_illness
    group_label: 现病史
    fields:
      - field_key: hpi_initial_onset
        label: 初次发病情况
        type: string
      - field_key: hpi_subsequent_course
        label: 后续发病情况
        type: string
      - field_key: hpi_hospital_diagnosis
        label: 院内诊断情况
        type: string
      - field_key: hpi_treatment_medications
        label: 治疗药物
        type: string
      - field_key: hpi_recent_symptoms
        label: 近期症状
        type: string
      - field_key: hpi_mental_status
        label: 精神
        type: string
      - field_key: hpi_stool_status
        label: 大便情况
        type: string
      - field_key: hpi_urine_status
        label: 小便情况
        type: string
      - field_key: hpi_weight_change
        label: 体重变化
        type: string
  - group_key: past_medical_history
    group_label: 既往史
    fields:
      - field_key: pmh_cardiac_disease
        label: 心脏病
        type: string
      - field_key: pmh_hypertension
        label: 高血压
        type: string
      - field_key: pmh_diabetes
        label: 糖尿病
        type: string
      - field_key: pmh_hepatitis_b
        label: 乙肝
        type: string
      - field_key: pmh_hematochezia
        label: 便血
        type: string
      - field_key: pmh_nephritis
        label: 肾炎
        type: string
      - field_key: pmh_hematologic_disease
        label: 血液病
        type: string
      - field_key: pmh_coronary_heart_disease
        label: 冠心病
        type: string
      - field_key: pmh_cerebral_infarction
        label: 脑梗塞
        type: string
      - field_key: pmh_surgery_history
        label: 手术史
        type: string
      - field_key: pmh_transfusion_history
        label: 输血史
        type: string
      - field_key: pmh_blood_product_history
        label: 血制品史
        type: string
      - field_key: pmh_allergy_history
        label: 过敏史
        type: string
  - group_key: personal_history
    group_label: 个人史
    fields:
      - field_key: personal_occupation
        label: 工作
        type: string
      - field_key: personal_smoking_history
        label: 吸烟史
        type: string
      - field_key: personal_drinking_history
        label: 饮酒史
        type: string
  - group_key: family_history
    group_label: 家族史
    fields:
      - field_key: family_history
        label: 家族史
        type: string
  - group_key: physical_examination
    group_label: 体格检查
    fields:
      - field_key: pe_temperature
        label: 体温
        type: string
      - field_key: pe_pulse
        label: 脉搏
        type: string
      - field_key: pe_respiration_rate
        label: 生命体征呼吸
        type: string
      - field_key: pe_blood_pressure
        label: 血压
        type: string
      - field_key: pe_height
        label: 身高
        type: string
      - field_key: pe_weight
        label: 体重
        type: string
      - field_key: pe_bmi
        label: BMI
        type: string
      - field_key: pe_skin
        label: 皮肤
        type: string
        description: 皮肤项目：颜色、皮疹、弹性、毛发、淋巴结；不含一般情况内容
      - field_key: pe_eyes
        label: 眼部
        type: string
        description: 眼部项目：睑结膜、球结膜、巩膜、角膜、瞳孔、对光反射、视力；不含头颅、头发、颜面、耳鼻口颈内容
      - field_key: pe_ears
        label: 耳部
        type: string
        description: 耳部项目：外耳道、鼓膜、听力、乳突；不含眼、鼻、口咽内容
      - field_key: pe_nose
        label: 鼻部
        type: string
        description: 鼻部项目：鼻腔、鼻窦、鼻翼、鼻通气；不含耳、口腔内容
      - field_key: pe_oral_cavity
        label: 口腔
        type: string
        description: 口腔咽喉项目：唇、齿、龈、舌、口腔黏膜、咽、扁桃体；不含颈部、耳鼻内容
      - field_key: pe_neck
        label: 颈部
        type: string
        description: 颈部项目：颈静脉、颈动脉、甲状腺、气管、颈软、淋巴结；不含口腔、胸部内容
      - field_key: pe_chest
        label: 胸部
        type: string
        description: 胸廓项目：胸廓形态、肋间隙、胸骨、挤压试验；双肺内容归呼吸系统检查，乳房内容归乳房字段
      - field_key: pe_breast
        label: 乳房
        type: string
        description: 乳房项目：对称、发育、乳头、皮肤、包块；不含胸廓、双肺内容
      - field_key: pe_respiratory_exam
        label: 呼吸系统查体
        type: string
        description: 呼吸系统项目：呼吸动度、语颤、叩诊音、呼吸音、啰音；不含胸廓形态、乳房内容
      - field_key: pe_cardiac_exam
        label: 心脏查体
        type: string
        description: 心脏项目：心前区、心尖搏动、心界、心率、心律、心音、杂音
      - field_key: pe_abdomen
        label: 腹部
        type: string
        description: 腹部项目：腹壁、压痛、肝脾、移动性浊音、Murphy 征
      - field_key: pe_limbs
        label: 四肢
        type: string
        description: 四肢脊柱项目：脊柱、关节、肌力、水肿、静脉曲张、病理征
      - field_key: pe_neurological_exam
        label: 神经
        type: string
        description: 神经系统项目：神志、精神、对答、反射、病理征；一般情况（发育/营养/体型/体位/表情）不属本字段
  - group_key: ancillary_tests
    group_label: 辅助检查
    fields:
      - field_key: aux_chest_ct
        label: 胸部CT
        type: string
      - field_key: aux_cardiac_ultrasound
        label: 心脏超声
        type: string
      - field_key: aux_blood_gas_ph
        label: 血气pH
        type: string
      - field_key: aux_blood_gas_pco2
        label: 血气pCO2
        type: string
      - field_key: aux_blood_gas_po2
        label: 血气pO2
        type: string
      - field_key: aux_blood_gas_na
        label: 血气Na+
        type: string
      - field_key: aux_blood_gas_fio2
        label: 血气FIO2
        type: string
      - field_key: aux_blood_gas_oxygenation_index
        label: 血气氧合指数
        type: string
      - field_key: aux_blood_routine
        label: 血常规
        type: string
      - field_key: aux_electrolytes
        label: 电解质
        type: string
        description: 电解质/矿物项目：钾、钠、氯、钙、镁、磷等电解质和矿物项目；不含肾功能项目（eGFR、尿素、肌酐、尿酸）
      - field_key: aux_renal_function
        label: 肾功
        type: string
        description: 肾功项目：eGFR、尿素、肌酐、尿酸等肾功能项目；不含电解质/矿物项目（钾、钠、氯、钙、镁、磷等）
      - field_key: aux_d_dimer
        label: D2聚体
        type: string
  - group_key: diagnosis
    group_label: 诊断
    fields:
      - field_key: diagnosis_preliminary
        label: 初步诊断
        type: string
      - field_key: diagnosis_final
        label: 最终诊断
        type: string
