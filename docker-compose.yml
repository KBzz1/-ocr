services:
  manzufei-ocr:
    image: manzufei-ocr:0.1.0
    container_name: manzufei-ocr
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
      - ./logs:/app/logs
      - ./models:/app/models
      - ./app/config/local.yaml:/app/app/config/local.yaml:ro
      - ./vllm_cache:/root/.cache/vllm
    environment:
      MANZUFEI_BACKEND_DEBUG: "0"
      MANZUFEI_PUBLIC_BASE_URL: "${MANZUFEI_PUBLIC_BASE_URL:-}"
    depends_on:
      qwen-vision-vllm-server:
        condition: service_healthy
    gpus: all

  qwen-vision-vllm-server:
    # 同一个本地 Qwen 视觉 vLLM 服务同时承担 OCR 与固定字段 JSON 抽取，
    # 后端通过 OpenAI Python SDK 调本服务的 /v1。
    image: qwen-vllm-openai:verified
    container_name: qwen-vision-vllm-server
    restart: unless-stopped
    command: >
      --model /workspace/model/llm/Qwen3.5-4B-AWQ-4bit
      --max-model-len ${QWEN_VLLM_MAX_MODEL_LEN:-16384}
      --gpu-memory-utilization ${QWEN_VLLM_GPU_MEMORY_UTILIZATION:-0.85}
      --max-num-seqs ${QWEN_VLLM_MAX_NUM_SEQS:-1}
      --enable-chunked-prefill
      --enable-prefix-caching
      --dtype auto
      --host 0.0.0.0
      --port 8000
      --trust-remote-code
    volumes:
      - ${QWEN_VLLM_MODEL_ROOT:-./models/llm}:/workspace/model/llm:ro
      - ./vllm_cache:/root/.cache/vllm
    ports:
      - "127.0.0.1:8082:8000"
    gpus: all
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
