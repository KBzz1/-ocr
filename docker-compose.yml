services:
  manzufei-ocr:
    image: manzufei-ocr:0.1.0
    container_name: manzufei-ocr
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
      - ./logs:/app/logs
      - ./models:/app/models
      - ./app/config/local.yaml:/app/app/config/local.yaml:ro
    environment:
      MANZUFEI_BACKEND_DEBUG: "0"
      MANZUFEI_PUBLIC_BASE_URL: "${MANZUFEI_PUBLIC_BASE_URL:-}"
    depends_on:
      paddleocr-vlm-server:
        condition: service_healthy
    gpus: all

  paddleocr-vlm-server:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-genai-vllm-server:latest-nvidia-gpu
    container_name: paddleocr-vlm-server
    restart: unless-stopped
    command: >
      paddleocr genai_server
      --model_name PaddleOCR-VL-1.6-0.9B
      --model_dir /workspace/model/PaddleOCR-VL-1.6
      --host 0.0.0.0
      --port 8080
      --backend vllm
      --backend_config /workspace/vlm_backend_config.yaml
    volumes:
      - ./models/ppstructure:/workspace/model
      - ./app/config/vlm_backend_config.yaml:/workspace/vlm_backend_config.yaml:ro
    gpus: all
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
